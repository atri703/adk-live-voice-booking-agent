[project]
name = "adk-live-voice-booking-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["google-adk>=1.0,<3", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-dotenv>=1,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["frontend*", "tests*"]
